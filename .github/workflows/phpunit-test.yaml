name: PHP Unit

on:
  pull_request:
    # 対象：マージ先のブランチ
    branches:
      - main
      # - develop
    # 対象：状態
    types:
      - opened
      - reopened
      - synchronize
    # トリガー対象外ファイル
    paths-ignore:
      - 'README.md'
  # 手動でGithubのActionsから実行できるようにする
  workflow_dispatch:

# 実行ジョブ（基本は並列で実行される）
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ["8.4"]

    steps:
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xdebug, dom

      - name: Checkout
        uses: actions/checkout@v5

      - name: Check PHP Version
        run: php -v

      - name: Check Composer Version
        run: composer -V

      - name: Check PHP Extensions
        run: php -m

      - name: Validate composer.json and composer.lock
        run: composer validate
        working-directory: src

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
        working-directory: src

      - name: Decrypt env
        run: |
          echo "${{ secrets.LARAVEL_ENV_KEY }}" > .env.key
          php artisan env:decrypt --key="$(cat .env.key)" --env=ci
          cp .env.ci .env.testing
        working-directory: src

      - name: Create coverage directory
        run: mkdir -p coverage
        working-directory: src

      - name: Run test suite with coverage
        run: php artisan test --coverage --coverage-clover=coverage/clover.xml --coverage-text=coverage/coverage.txt --coverage-html=coverage/html
        working-directory: src

      - name: Display coverage summary
        run: |
          if [ -f coverage/coverage.txt ]; then
            echo "=== Code Coverage Summary ==="
            cat coverage/coverage.txt
          else
            echo "Coverage text file not found"
          fi
        working-directory: src

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            src/coverage/
          retention-days: 30
