# .github/workflows/php-version-check.yml
name: PHP バージョン一致チェック

on:
  pull_request:
    # 対象：マージ先のブランチ
    branches:
      - main
      # - develop
    # 対象：状態
    types:
      - opened
      - reopened
      - synchronize
    # トリガー対象外ファイル
    paths-ignore:
      - 'README.md'
  # 手動でGithubのActionsから実行できるようにする
  workflow_dispatch:

jobs:
  php-version-check:
    runs-on: ubuntu-latest

    env:
      # チェック対象の Docker イメージを指定
      PROJECT_PATH: src # 例: "apps/api" など
      DOCKER_IMAGE: amazonlinux:2023 # php が入っているアプリ用イメージ推奨

    steps:
      - name: ソースコードをチェックアウト
        uses: actions/checkout@v4

      - name: jq をインストール
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: composer.json の存在確認
        run: |
          if [ ! -f "$PROJECT_PATH/composer.json" ]; then
            echo "::error::PROJECT_PATH=$PROJECT_PATH に composer.json が見つかりません"
            exit 1
          fi

      - name: composer.json から PHP の制約を読み取り
        id: composer
        run: |
          set -e
          PLATFORM_PHP=$(jq -r '.config.platform.php // empty' "$PROJECT_PATH/composer.json")
          REQUIRE_PHP=$(jq -r '.require.php // empty' "$PROJECT_PATH/composer.json")

          if [ -n "$PLATFORM_PHP" ]; then
            echo "constraint=$PLATFORM_PHP" >> "$GITHUB_OUTPUT"
            echo "source=config.platform.php" >> "$GITHUB_OUTPUT"
          elif [ -n "$REQUIRE_PHP" ]; then
            echo "constraint=$REQUIRE_PHP" >> "$GITHUB_OUTPUT"
            echo "source=require.php" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::composer.json に PHP バージョンの指定が見つかりません（config.platform.php / require.php）"
            echo "constraint=" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker イメージから PHP の実際のバージョンを取得（静かに取得）
        id: image
        run: |
          set -e
          # dnf のログを絶対に標準出力へ出さない。標準エラーも捨てる。
          ACTUAL=$(
            docker run --rm "$DOCKER_IMAGE" bash -lc '
              set -e
              if ! command -v php >/dev/null 2>&1; then
                # できるだけ静かにインストール（出力はすべて捨てる）
                dnf -y -q update >/dev/null 2>&1 || true
                dnf -y -q install php84-cli >/dev/null 2>&1 || \
                dnf -y -q install php-cli   >/dev/null 2>&1
              fi
              php -r "echo PHP_VERSION;"
            ' 2>/dev/null
          )
          ACTUAL=$(echo -n "$ACTUAL" | tr -d '\r\n')
          echo "actual=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "イメージの PHP バージョン: $ACTUAL"

      - name: バージョンを比較（semver で判定）
        if: steps.composer.outputs.constraint != ''
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm i semver@7 >/dev/null 2>&1
          node - <<'EOF'
          const semver = require('semver');
          const actual = process.env.ACTUAL;
          const constraint = process.env.CONSTRAINT;
          const source = process.env.SOURCE;
          const ok = semver.satisfies(semver.coerce(actual), constraint, { includePrerelease: true });
          if (!ok) {
            console.error(`❌ Docker イメージ内の PHP ${actual} は composer.json の ${source} (${constraint}) を満たしていません`);
            process.exit(1);
          } else {
            console.log(`✅ Docker イメージ内の PHP ${actual} は composer.json の ${source} (${constraint}) を満たしています`);
          }
          EOF
        env:
          ACTUAL: ${{ steps.image.outputs.actual }}
          CONSTRAINT: ${{ steps.composer.outputs.constraint }}
          SOURCE: ${{ steps.composer.outputs.source }}

      - name: バージョン指定が無い場合の通知
        if: steps.composer.outputs.constraint == ''
        run: echo "::notice::composer.json に PHP のバージョン指定が無いためチェックをスキップしました"
